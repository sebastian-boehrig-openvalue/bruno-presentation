components:
  schemas:
    ClientResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        standingRequirements:
          type: array
          description: The Client's Standing Requirements in display order, each carrying its own MoSCoW relevance. Always present, empty when the Client has none.
          maxItems: 200
          items:
            $ref: "#/components/schemas/RequirementTO"
        tenantId:
          type: string
      required:
        - id
        - standingRequirements
    CreateClientRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/NonEmptyString"
        standingRequirements:
          type: array
          description: The Client's Standing Requirements in display order, each carrying its own MoSCoW relevance. An absent field and an empty list both create the Client without any.
          maxItems: 200
          items:
            $ref: "#/components/schemas/RequirementTO"
      required:
        - name
    UpdateClientRequest:
      type: object
      description: Replaces a Client's name and its whole Standing Requirement list. Every Project of this Client states the new list from the next read on.
      properties:
        name:
          type: string
          description: The Client's new name. Must be non-blank and unique within the tenant (case-insensitive).
        standingRequirements:
          type: array
          description: The Client's Standing Requirements in display order, each carrying its own MoSCoW relevance.
          maxItems: 200
          items:
            $ref: "#/components/schemas/RequirementTO"
      required:
        - name
        - standingRequirements
    ContentMatchResponse:
      type: object
      required:
        - results
        - failedCount
        - partialFailure
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ContentMatchResultDTO"
        failedCount:
          type: integer
          format: int32
        partialFailure:
          type: boolean
    CombinedEmailRequest:
      type: object
      properties:
        talents:
          type: array
          items:
            $ref: "#/components/schemas/TalentEmailRequestItem"
          minItems: 1
      required:
        - talents
    TalentEmailRequestItem:
      type: object
      required:
        - talent
        - requirementKeys
      properties:
        talent:
          $ref: "#/components/schemas/ContentMatchResultDTO"
        requirementKeys:
          type: array
          description: Requirement texts of the verdicts to include, as returned in RequirementMatch.requirement.
          items:
            type: string
        tweakedSkills:
          type: array
          items:
            $ref: "#/components/schemas/TweakedCvSkill"
        tweakedTalent:
          $ref: "#/components/schemas/ContentMatchResultDTO"
        tweakedRequirementKeys:
          type: array
          description: Requirement texts of the tweakedTalent verdicts to include, as returned in RequirementMatch.requirement.
          items:
            type: string
    CombinedEmailTO:
      type: object
      required:
        - emailText
      properties:
        emailText:
          type: string
    GenerateEmailRequest:
      type: object
      properties:
        talents:
          type: array
          items:
            $ref: "#/components/schemas/ContentMatchResultDTO"
          minItems: 1
        requirementKeys:
          type: array
          description: Requirement texts of the verdicts to include, as returned in RequirementMatch.requirement.
          items:
            type: string
        tweakedTalent:
          $ref: "#/components/schemas/ContentMatchResultDTO"
        tweakedRequirementKeys:
          type: array
          description: Requirement texts of the tweakedTalent verdicts to include, as returned in RequirementMatch.requirement.
          items:
            type: string
        tweakedSkills:
          type: array
          items:
            $ref: "#/components/schemas/TweakedCvSkill"
      required:
        - talents
    TalentEmailDTO:
      type: object
      required:
        - talentId
        - talentName
        - emailText
      properties:
        talentId:
          type: string
        talentName:
          type: string
        emailText:
          type: string
    CvExportRequest:
      type: object
      properties:
        templateId:
          $ref: "#/components/schemas/NonEmptyString"
      required:
        - templateId
    CvTemplateOverviewResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        templateKey:
          type: string
        description:
          type: string
        anonymous:
          type: boolean
        language:
          type: string
        primaryColorOverride:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
        showProfilePicture:
          type: boolean
        companyLogoUrl:
          type: string
    CreateCvTemplateRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/NonEmptyString"
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]+$
        templateKey:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]+$
        description:
          type: string
        anonymous:
          type: boolean
        language:
          type: string
          minLength: 1
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
        primaryColorOverride:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        tenantId:
          type: string
        showProfilePicture:
          type: boolean
      required:
        - anonymous
        - language
        - name
        - showProfilePicture
        - slug
        - templateKey
    CvTemplateDetailResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        templateKey:
          type: string
        description:
          type: string
        anonymous:
          type: boolean
        language:
          type: string
        primaryColorOverride:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
        showProfilePicture:
          type: boolean
        companyLogoUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiExtractRequest:
      type: object
      discriminator:
        propertyName: mode
        mapping:
          File: "#/components/schemas/FileAiExtractRequest"
          Text: "#/components/schemas/TextAiExtractRequest"
      properties:
        mode:
          type: string
      required:
        - mode
    FileAiExtractRequest:
      allOf:
        - $ref: "#/components/schemas/AiExtractRequest"
        - type: object
          properties:
            documentRef:
              type: string
    TextAiExtractRequest:
      allOf:
        - $ref: "#/components/schemas/AiExtractRequest"
        - type: object
          properties:
            prompt:
              type: string
    LayoutOverviewResponse:
      type: object
      properties:
        templateKey:
          type: string
        displayName:
          type: string
        language:
          type: string
        primaryColor:
          type: string
        profilePictureSlot:
          type: boolean
        companyLogoSlot:
          type: boolean
        tenantId:
          type: string
        sectionsOrder:
          type: array
          items:
            type: string
        optionalSections:
          type: array
          items:
            type: string
        thumbnailUrl:
          type: string
    PreviewCvTemplateRequest:
      type: object
      properties:
        templateKey:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]+$
        language:
          type: string
          minLength: 1
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
        anonymous:
          type: boolean
        primaryColorOverride:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        showProfilePicture:
          type: boolean
        templateId:
          type: string
        tenantId:
          type: string
      required:
        - anonymous
        - language
        - showProfilePicture
        - templateKey
    UpdateCvTemplateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        anonymous:
          type: boolean
        language:
          type: string
        primaryColorOverride:
          type: string
        showProfilePicture:
          type: boolean
    CompanyLogoUploadResponse:
      type: object
      properties:
        s3Key:
          type: string
        presignedUrl:
          type: string
    TweakedCvResponse:
      type: object
      properties:
        id:
          type: string
        talentId:
          type: string
        projectId:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/TweakedCvSkill"
        cvText:
          type: string
        scope:
          type: string
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    SaveTweakRequest:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/TweakedCvSkill"
        cvText:
          $ref: "#/components/schemas/NonEmptyString"
        scope:
          type: string
          maxLength: 500
          minLength: 0
      required:
        - cvText
        - skills
    GenerateCvTextRequest:
      type: object
      properties:
        allOriginalSkills:
          type: array
          items:
            $ref: "#/components/schemas/TweakedCvSkill"
        newSkills:
          type: array
          items:
            $ref: "#/components/schemas/TweakedCvSkill"
    TweakedCvSkill:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/NonEmptyString"
        since:
          type:
            - integer
            - "null"
          format: int32
      required:
        - name
    GenerateCvTextResponse:
      type: object
      properties:
        cvText:
          type: string
    ContentMatchResultDTO:
      type: object
      required:
        - id
        - score
        - requirementMatches
        - mustHaveGaps
        - governmentExperience
        - governmentSectors
      properties:
        id:
          type: string
        name:
          type: string
        score:
          type: integer
          format: int32
          description: Weighted fulfilment of the project's requirements, 0..100. Computed from the per-requirement verdicts, not returned by the model.
        summary:
          type: string
        requirementMatches:
          type: array
          items:
            $ref: "#/components/schemas/RequirementMatch"
        mustHaveGaps:
          type: integer
          format: int32
          description: Number of MUST_HAVE requirements this candidate does not fully meet, PARTIALLY_FULFILLED included. A missed Must-have costs the most weight in the score and breaks ties between equal scores, but never removes the candidate from the result.
        title:
          type: string
        imageUrl:
          type: string
        originalDocumentReference:
          type: string
        governmentExperience:
          type: boolean
        governmentSectors:
          type: array
          items:
            type: string
        matchAvailability:
          type: string
          description: Whether the Talent is free when the Project starts or only later during its runtime.
          enum:
            - AT_PROJECT_START
            - DURING_PROJECT
        availableFrom:
          type:
            - string
            - "null"
          format: date
          description: Date the Talent becomes available; null when they already are.
        scoreExplanation:
          type:
            - string
            - "null"
          description: AI-generated explanation of why the talent received this score and what is missing to reach 100%, in the caller's language. Null when generation failed.
    RequirementMatch:
      type: object
      description: One requirement's verdict. A result carries exactly one per requirement, in requirement order, and the overall score is computed from them, weighted by relevance.
      required:
        - requirement
        - status
        - relevance
      properties:
        requirement:
          type: string
          description: The requirement's text as stored, not as paraphrased by the model.
        status:
          type: string
          description: FULFILLED, PARTIALLY_FULFILLED or NOT_FULFILLED.
          enum:
            - FULFILLED
            - PARTIALLY_FULFILLED
            - NOT_FULFILLED
        reasoning:
          type:
            - string
            - "null"
          description: Evidence for the verdict. Null when the model gave no verdict for this requirement, which then counts as NOT_FULFILLED.
        relevance:
          $ref: "#/components/schemas/RequirementRelevance"
    TweakSuggestionResponse:
      type: object
      properties:
        suggestedSkills:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedSkill"
        rationale:
          type: string
    SuggestedSkill:
      type: object
      properties:
        name:
          type: string
        since:
          type: integer
          format: int32
        rationale:
          type: string
    FeedbackRecordResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        route:
          type:
            - string
            - "null"
        url:
          type:
            - string
            - "null"
        context:
          type:
            - string
            - "null"
        submitterEmail:
          type:
            - string
            - "null"
        tenantId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      description: RFC 9457 Problem JSON error response.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
    FeedbackRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
        route:
          type:
            - string
            - "null"
          maxLength: 512
        url:
          type:
            - string
            - "null"
          maxLength: 2048
        context:
          type:
            - string
            - "null"
          maxLength: 1024
      required:
        - message
    FeedbackResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    DocumentExtractResponse:
