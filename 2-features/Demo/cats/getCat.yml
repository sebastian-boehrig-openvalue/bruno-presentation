info:
  name: getCat
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/cat/{{myId}}"
  headers:
    - name: Content-Language
      value: en
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: "200"
    request:
      url: "{{baseURL}}/cat/123"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "name": "Wolfram III",
            "age": 21
          }
